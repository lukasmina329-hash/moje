name: Zbuduj APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Zaakceptuj licencje Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Testy logiki
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Zbuduj APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Zapisz APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: KodySMS-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Opublikuj APK w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KodySMS.apk
          gh release create "build-${{ github.run_number }}" KodySMS.apk \
            --title "Kody SMS – build ${{ github.run_number }}" \
            --notes "Plik KodySMS.apk do instalacji na telefonie z kartą."
